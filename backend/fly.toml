# fly.toml app configuration file generated for backend-blue-resonance-8504 on 2026-07-06T21:10:47Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'backend-blue-resonance-8504'primary_region = 'iad'

[build]
  # Explicit Dockerfile path so `fly deploy` doesn't need to guess. Pinned
  # relative to this fly.toml (which lives in backend/).
  dockerfile = "Dockerfile"

[http_service] 
  # Explicit Dockerfile path so `fly deploy` doesn't need to guess. Pinned
  # relative to this fly.toml (which lives in backend/).
  dockerfile = "Dockerfile"

[http_service] 
  internal_port = 8000
  force_https = true
  # Keep the machine warm so chat turns don't pay a 1-3s cold-start penalty on
  # the first message after idle. SSE-streaming responses also need the
  # machine available across stream lifetimes.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
