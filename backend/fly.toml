# fly.toml app configuration file for backend-blue-resonance-8504.
#
# See https://fly.io/docs/reference/configuration/ for reference.
#

app = 'backend-blue-resonance-8504'
primary_region = 'iad'

[build]
  # Explicit Dockerfile path so `fly deploy` doesn't need to guess. Pinned
  # relative to this fly.toml (which lives in backend/).
  dockerfile = "Dockerfile"
  # Pin the .dockerignore for defense-in-depth: stops `.env`, *.db,
  # `__pycache__/`, `tests/`, `data/`, etc. from being COPY'd into the
  # runtime image even if a future PR accidentally regresses the .dockerignore.
  ignorefile = ".dockerignore"

[http_service]
  internal_port = 8000
  force_https = true
  # Keep the machine warm so chat turns don't pay a 1-3s cold-start penalty on
  # the first message after idle. SSE-streaming responses also need the
  # machine available across stream lifetimes.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
